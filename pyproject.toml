[project]
name = "zvuk"
version = "0.1.0"
description = "Telegram media bot powered by aiogram and yt-dlp"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4",
  "SQLAlchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "redis>=5.2,<7",
  "pydantic-settings>=2.8,<3",
  "yt-dlp[default]>=2025.3.31",
  "aiohttp>=3.11,<4",
]
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
