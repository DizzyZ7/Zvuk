name: zvuk
x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    - media_tmp:/shared
    # Local Bot API returns filesystem paths in local mode.
    - bot_api_data:/var/lib/telegram-bot-api:ro
    # Optional: provide cookies via a bind mount and set YTDLP_COOKIES
    # - ./secrets/cookies.txt:/run/secrets/cookies.txt:ro
  depends_on:
    postgres:
      condition: service_healthy
    telegram-bot-api:
      condition: service_started
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zvuk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: zvuk
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zvuk -d zvuk"]
      interval: 5s
      timeout: 3s
      retries: 20
  media-init:
    image: alpine:3.21
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /shared && chown 10001:10001 /shared && chmod 755 /shared"]
    volumes: [media_tmp:/shared]
  telegram-bot-api:
    depends_on:
      media-init:
        condition: service_completed_successfully
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot_api_data:/var/lib/telegram-bot-api
      - media_tmp:/shared:ro
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
  bot:
    <<: *app
    command: ["python", "-m", "app.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      telegram-bot-api:
        condition: service_started
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      telegram-bot-api:
        condition: service_started
volumes:
  postgres_data:
  bot_api_data:
  media_tmp:
