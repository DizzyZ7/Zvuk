name: zvuk
x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    - media_tmp:/shared
    # Optional: provide cookies via a bind mount and set YTDLP_COOKIES
    # - ./secrets/cookies.txt:/run/secrets/cookies.txt:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    telegram-bot-api:
      condition: service_started
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zvuk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: zvuk
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zvuk -d zvuk"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot_api_data:/var/lib/telegram-bot-api
      - media_tmp:/shared:ro
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
  bot:
    <<: *app
    command: ["python", "-m", "app.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      telegram-bot-api:
        condition: service_started
      redis:
        condition: service_healthy
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      telegram-bot-api:
        condition: service_started
      redis:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  bot_api_data:
  media_tmp:
